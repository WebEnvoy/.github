name: FR
description: 有多个独立交付项时使用的用户或系统成果。
title: ""
type: "FR"
body:
  - type: textarea
    id: outcome
    attributes:
      label: 结果与价值
      description: 谁能完成什么以前不能完成的事？
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: 子项与退出信号
      description: 列出必要子 Work Item；没有真实分解时请直接创建 Work Item。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 约束与非目标
    validations:
      required: true
