name: Work Item
description: 可独立执行和验收的工作项。
title: ""
type: "Work Item"
body:
  - type: textarea
    id: outcome
    attributes:
      label: 用户或 Agent 结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 规范依据、事实与假设
      description: 链接 canonical 章节和真实入口；区分已知事实与待验证假设。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 写清成功、必要拒绝和可恢复失败，以及最小真实消费者。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 真正依赖、复用与删除
      description: 只有不满足就不能开始或验收的事项才是硬依赖。
    validations:
      required: false
